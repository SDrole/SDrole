name: Update profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest blackholesim commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          req = urllib.request.Request(
              "https://api.github.com/repos/SDrole/blackholesim/commits?per_page=1",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as response:
              item = json.load(response)[0]

          sha = item["sha"][:7]
          subject = item["commit"]["message"].splitlines()[0]
          url = item["html_url"]
          latest = f"**Latest:** [`{sha}`]({url}) — {subject}"

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          start = "<!-- latest:start -->"
          end = "<!-- latest:end -->"
          a = text.index(start) + len(start)
          b = text.index(end)
          text = text[:a] + "\n" + latest + "\n" + text[b:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile activity"
          git push
