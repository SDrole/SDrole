<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">SDrole</title>
  <desc id="d">Rendering of a Kerr black hole: shadow, photon ring and a lensed accretion disk with relativistic beaming.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060b"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="bloom" cx="880" cy="165" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".34"/>
      <stop offset=".30" stop-color="#e0601f" stop-opacity=".16"/>
      <stop offset=".65" stop-color="#7a2a14" stop-opacity=".05"/>
      <stop offset="1" stop-color="#7a2a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="600" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3dc" stop-opacity=".95"/>
      <stop offset=".30" stop-color="#ffd08a"/>
      <stop offset=".55" stop-color="#f08a36"/>
      <stop offset=".80" stop-color="#b43c18"/>
      <stop offset="1" stop-color="#4b1608" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="ring" x1="790" y1="0" x2="970" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset=".5" stop-color="#ffc67a"/>
      <stop offset="1" stop-color="#c2531e"/>
    </linearGradient>
    <linearGradient id="fadeText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04060b" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#04060b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#04060b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#e0601f"/>
    </linearGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".6"/></filter>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="upper"><rect x="500" y="60" width="760" height="105"/></clipPath>
    <clipPath id="lower"><rect x="500" y="165" width="760" height="120"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g fill="#cfd8ec">
      <circle cx="612" cy="38" r=".9" opacity=".55"/><circle cx="668" cy="271" r="1" opacity=".5"/>
      <circle cx="702" cy="64" r=".7" opacity=".6"/><circle cx="731" cy="292" r=".8" opacity=".4"/>
      <circle cx="768" cy="24" r="1.1" opacity=".5"/><circle cx="803" cy="268" r=".7" opacity=".55"/>
      <circle cx="846" cy="41" r=".8" opacity=".45"/><circle cx="952" cy="27" r=".9" opacity=".6"/>
      <circle cx="1004" cy="58" r=".7" opacity=".5"/><circle cx="1041" cy="283" r="1" opacity=".45"/>
      <circle cx="1078" cy="34" r="1.2" opacity=".55"/><circle cx="1112" cy="256" r=".8" opacity=".5"/>
      <circle cx="1146" cy="82" r=".7" opacity=".5"/><circle cx="1167" cy="196" r=".9" opacity=".4"/>
      <circle cx="590" cy="214" r=".7" opacity=".4"/><circle cx="1128" cy="300" r=".7" opacity=".4"/>
      <circle cx="920" cy="302" r=".8" opacity=".35"/><circle cx="741" cy="118" r=".6" opacity=".4"/>
      <circle cx="1090" cy="132" r=".6" opacity=".4"/><circle cx="636" cy="96" r=".6" opacity=".35"/>
    </g>
    <circle cx="880" cy="165" r="300" fill="url(#bloom)">
      <animate attributeName="opacity" values=".8;1;.8" dur="9s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="880" cy="165" r="79" fill="none" stroke="url(#beam)" stroke-width="16" opacity=".55" filter="url(#blur14)"/>
      <circle cx="880" cy="165" r="79" fill="none" stroke="url(#beam)" stroke-width="7" opacity=".75" filter="url(#blur6)"/>
      <circle cx="880" cy="165" r="79" fill="none" stroke="url(#beam)" stroke-width="2.4" filter="url(#blur1)"/>
      <circle cx="880" cy="165" r="70" fill="none" stroke="url(#beam)" stroke-width="1" opacity=".6"/>
    </g>
    <g transform="rotate(-8 880 165)">
      <g clip-path="url(#upper)">
        <path fill-rule="evenodd" fill="url(#beam)" opacity=".85"
              d="M610 165a270 30 0 1 0 540 0a270 30 0 1 0-540 0ZM808 165a72 7 0 1 0 144 0a72 7 0 1 0-144 0Z"/>
      </g>
    </g>
    <circle cx="880" cy="165" r="61" fill="#000"/>
    <circle cx="880" cy="165" r="62" fill="none" stroke="url(#ring)" stroke-width="5" opacity=".7" filter="url(#blur6)"/>
    <circle cx="880" cy="165" r="62" fill="none" stroke="url(#ring)" stroke-width="1.6"/>
    <g transform="rotate(-8 880 165)">
      <g clip-path="url(#lower)">
        <path fill-rule="evenodd" fill="url(#beam)" opacity=".6" filter="url(#blur14)"
              d="M610 165a270 30 0 1 0 540 0a270 30 0 1 0-540 0ZM808 165a72 7 0 1 0 144 0a72 7 0 1 0-144 0Z"/>
        <path fill-rule="evenodd" fill="url(#beam)"
              d="M610 165a270 30 0 1 0 540 0a270 30 0 1 0-540 0ZM808 165a72 7 0 1 0 144 0a72 7 0 1 0-144 0Z"/>
        <g fill="none" stroke="#000" stroke-width=".7" opacity=".28">
          <ellipse cx="880" cy="165" rx="110" ry="12"/>
          <ellipse cx="880" cy="165" rx="150" ry="16.5"/>
          <ellipse cx="880" cy="165" rx="195" ry="21"/>
          <ellipse cx="880" cy="165" rx="235" ry="26"/>
        </g>
      </g>
    </g>
    <rect width="620" height="320" fill="url(#fadeText)"/>
    <rect x="64" y="96" width="44" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="62" y="170" fill="#f4f6fb" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="600" letter-spacing="-1.5">SDrole</text>
    <text x="64" y="212" fill="#c9d1e0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" letter-spacing=".2">GR ray tracing · Relativistic hydrodynamics</text>
    <text x="64" y="242" fill="#7f8aa3" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" letter-spacing=".2">Offensive security · Linux systems</text>
    <rect x=".5" y=".5" width="1199" height="319" rx="17.5" fill="none" stroke="#1b2438"/>
  </g>
</svg>