<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 435" width="1000" height="435" role="img" aria-labelledby="title desc">
  <title id="title">SDrole</title>
  <desc id="desc">Software development, physics and mathematics, and offensive security.</desc>
  <defs>
    <linearGradient id="bg" x2="100%" y2="100%">
      <stop stop-color="#0c111b"/><stop offset=".64" stop-color="#1c162b"/><stop offset="1" stop-color="#102521"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#ffc276"/><stop offset=".52" stop-color="#c2a5ff"/><stop offset="1" stop-color="#83f0c7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c4c6e4" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="433" rx="22"/></clipPath>
  </defs>
  <style>
    .name { animation: rise .7s cubic-bezier(.2,.75,.3,1) both; }
    .line { animation: rise .65s cubic-bezier(.2,.75,.3,1) both; }
    .bar { transform-origin: 54px 189px; animation: draw .9s .22s cubic-bezier(.2,.75,.3,1) both; }
    @keyframes rise { from {opacity:0;transform:translateY(12px)} to {opacity:1;transform:translateY(0)} }
    @keyframes draw { from {transform:scaleX(0)} to {transform:scaleX(1)} }
    @media (prefers-reduced-motion: reduce) { .name,.line,.bar {animation:none} }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="435" fill="url(#bg)"/>
    <rect width="1000" height="435" fill="url(#grid)"/>
    <path d="M706 0L1000 294M782 0L1000 218M858 0L1000 142" fill="none" stroke="#c2a5ff" opacity=".09" stroke-width="2"/>
    <g class="name">
      <text x="49" y="126" fill="#f7f4ff" font-family="system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-5">SDrole<tspan fill="#c2a5ff">.</tspan></text>
      <text x="55" y="161" fill="#c9cce0" font-family="Consolas, monospace" font-size="21">Developer · Physics &amp; mathematics student</text>
    </g>
    <rect class="bar" x="54" y="187" width="892" height="3" rx="1.5" fill="url(#accent)"/>
    <g transform="translate(0 0)"><g class="line" style="animation-delay:0.32s" font-family="Consolas, monospace">
      <rect x="55" y="223" width="7" height="34" rx="3.5" fill="#ffc276"/>
      <text x="78" y="235" fill="#ffc276" font-size="21" font-weight="700">SOFTWARE DEVELOPMENT</text>
      <text x="78" y="257" fill="#dce0ee" font-size="16" letter-spacing=".75">C++ / SCIENTIFIC COMPUTING</text>
    </g></g>
    <g transform="translate(0 65)"><g class="line" style="animation-delay:0.54s" font-family="Consolas, monospace">
      <rect x="55" y="223" width="7" height="34" rx="3.5" fill="#c2a5ff"/>
      <text x="78" y="235" fill="#c2a5ff" font-size="21" font-weight="700">PHYSICS &amp; MATHEMATICS</text>
      <text x="78" y="257" fill="#dce0ee" font-size="16" letter-spacing=".75">QUANTUM MECHANICS / ASTROPHYSICS</text>
    </g></g>
    <g transform="translate(0 130)"><g class="line" style="animation-delay:0.76s" font-family="Consolas, monospace">
      <rect x="55" y="223" width="7" height="34" rx="3.5" fill="#83f0c7"/>
      <text x="78" y="235" fill="#83f0c7" font-size="21" font-weight="700">OFFENSIVE SECURITY</text>
      <text x="78" y="257" fill="#dce0ee" font-size="16" letter-spacing=".75">RED TEAM / AUTHORIZED LABS</text>
    </g></g>
  </g>
  <rect x="1.5" y="1.5" width="997" height="432" rx="22" fill="none" stroke="#485064"/>
</svg>
